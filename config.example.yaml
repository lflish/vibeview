# vibeview 配置文件示例
# 复制本文件为 config.yaml 并填入真实值。config.yaml 已被 .gitignore 忽略，切勿提交。

server:
  port: 3000
  # 监听地址。放在 nginx 等反向代理后面时设为 127.0.0.1，外部只能经代理访问；缺省监听所有网卡。
  # host: "127.0.0.1"
  # 生成预览链接用的对外地址（不要带结尾斜杠）
  base_url: "http://localhost:3000"
  # 仅信任本机反向代理。直连部署可设 false；代理需覆盖/追加真实客户端 IP。
  # 使用其他代理地址时明确配置其 IP/CIDR，不要盲目设为 true。
  trust_proxy: "loopback"

storage:
  # 按类型分目录存储；每个文件落在 <type_dir>/<id>/<原文件名>
  html_dir: "./data/html"
  image_dir: "./data/images"
  video_dir: "./data/videos"
  # 元数据存放目录，每条上传一个 <id>.json
  meta_dir: "./data/meta"
  # 0 = 永久保留；正数 = 超过该天数后永久删除（账户可单独覆盖）
  retention_days: 0
  # 单文件大小上限（MB）
  max_size_mb: 50

# 访问码过期只限制访问，不删除文件；与 storage.retention_days 分开。
access:
  default_required: true
  default_days: 7
  grant_minutes: 30
  # 历史资源没有 access 设置时也加锁；管理员生成访问码或显式设为公开。
  protect_legacy: true
  # 每个页面的失败尝试累计限额；换 IP 或重启服务也不能绕过。
  max_attempts: 10
  retry_window_minutes: 10
  attempts_file: "./data/preview-attempts.json"
  # 管理端查看访问码所用的加密密钥；缺省使用 admin.session_secret。
  # 更换后已有访问码仍可验证，但需重置才能在管理端查看。
  # code_secret: "replace-with-a-random-secret"

# 上传账户列表：每个 token 即一个「账户 / 来源」。
# name 会写入资源 meta.source，用于管理端筛选、用量统计与自助 API 鉴权。
# 生成方式示例： openssl rand -hex 24
tokens:
  - name: "example-machine"
    token: "replace-with-a-long-random-token"
    # 可选配额（不写则不限制，仅受全局 max_size_mb 约束）
    # max_files: 100
    # max_storage_mb: 500
    # 可选：覆盖全局保留天数；0 表示该账户资源不自动清理
    # retention_days: 3
    # 可选：配置级停用（也可用管理端一键停用，写入 data/account-state.json）
    # disabled: false

# 管理端登录账号（全局管理员，可看全部账户资源）
admin:
  user: "admin"
  password: "replace-with-a-strong-password"
  # session 加密密钥，随便填一长串随机字符： openssl rand -hex 32
  session_secret: "replace-with-a-random-session-secret"
  # 管理登录：同一客户端 10 分钟最多失败 10 次；共享上限防止换 IP 猜码。
  login_max_attempts: 10
  login_global_max_attempts: 100
  login_retry_window_minutes: 10
  # 持久化计数，重启不清空；单个主服务进程拥有此文件。
  login_attempts_file: "./data/admin-login-attempts.json"

# 管理统计：独立持久化事件，不随资源删除或索引重建清空。
statistics:
  timezone: "Asia/Shanghai"
  # 缺省为 storage.meta_dir 旁的 statistics/；发布/回滚保留，备份包含此目录。
  # 单个主服务进程拥有日志；不与资源目录共用。
  # 预览访问计数（每日打开次数、访问码验证）保存在此目录的 visits.sqlite，同样需要保留和备份。
  directory: "./data/statistics"

# 预览渲染 sidecar（可选）。默认关闭：主服务本地直出 /v（无 Docker 开发）。
# 生产：docker compose up -d 起 render 后设 proxy_to_render: true
# 也可用环境变量：DVIEW_PREVIEW_PROXY=true  DVIEW_RENDER_URL=http://127.0.0.1:3001
preview:
  proxy_to_render: false
  render_url: "http://127.0.0.1:3001"
  proxy_timeout_ms: 30000
  # Sidecar 模式：主服务与 docker compose 需要设置同一随机密钥。
  # export DVIEW_RENDER_GATEWAY_TOKEN="$(openssl rand -hex 32)"
  # 或主服务在这里配置 gateway_token，Compose 使用上述环境变量。
