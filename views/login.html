<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vibeview · 登录</title>
<style>
  body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;
       background:#1a1a1a;color:#eee;font-family:system-ui,sans-serif;}
  .box{background:#262626;padding:32px;border-radius:12px;width:300px;box-shadow:0 8px 30px rgba(0,0,0,.4);}
  h1{margin:0 0 20px;font-size:20px;text-align:center;}
  input{width:100%;box-sizing:border-box;margin:6px 0;padding:10px;border:1px solid #444;
        border-radius:6px;background:#1a1a1a;color:#eee;}
  button{width:100%;margin-top:12px;padding:10px;border:0;border-radius:6px;
         background:#4f8cff;color:#fff;font-size:15px;cursor:pointer;}
  button:hover{background:#3a78ee;}
  .err{color:#ff6b6b;font-size:13px;text-align:center;min-height:18px;}
</style>
</head>
<body>
  <form class="box" method="post" action="/admin/login">
    <h1>vibeview 管理端</h1>
    <div class="err" id="err"></div>
    <input name="user" placeholder="账号" autocomplete="username" autofocus>
    <input name="password" type="password" placeholder="密码" autocomplete="current-password">
    <button type="submit">登录</button>
  </form>
  <script>
    if (new URLSearchParams(location.search).get('error')) {
      document.getElementById('err').textContent = '账号或密码错误';
    }
  </script>
</body>
</html>
