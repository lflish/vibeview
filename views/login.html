<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%279%27 fill=%27%232563eb%27/%3E%3Cg fill=%27none%27 stroke=%27white%27 stroke-width=%272.2%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Crect x=%277%27 y=%278%27 width=%2718%27 height=%2716%27 rx=%273%27/%3E%3Cpath d=%27M7 13h18M12 18l3 3 5-5%27/%3E%3C/g%3E%3C/svg%3E">
<title>vibeview · 登录</title>
<script src="/admin/theme.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: var(--font); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  .topbar {
    position: fixed; top: 0; right: 0; left: 0; z-index: 2;
    display: flex; justify-content: flex-end; padding: 18px 24px; pointer-events: none;
  }
  .topbar .theme-picker { pointer-events: auto; }
  .shell { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); min-height: 100vh; }

  /* Brand side */
  .showcase {
    position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between;
    padding: 40px 56px 36px; border-right: 1px solid var(--border);
    background: linear-gradient(150deg, var(--panel) 0%, var(--blue-bg) 100%);
  }
  .showcase::after {
    content: ""; position: absolute; right: -140px; bottom: -160px; width: 420px; height: 420px; border-radius: 50%;
    background: radial-gradient(circle, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%);
    pointer-events: none;
  }
  .brand { display: inline-flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none;
    font-size: 21px; font-weight: 750; letter-spacing: -.5px; }
  .mark { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 11px; background: #2563eb; color: #fff; }
  .pitch { position: relative; z-index: 1; max-width: 460px; margin: 48px 0; }
  .pitch h2 { margin: 0 0 14px; font-size: 34px; line-height: 1.25; letter-spacing: -1px; font-weight: 750; }
  .pitch h2 em { font-style: normal; color: var(--accent); }
  .pitch > p { margin: 0 0 28px; color: var(--secondary); font-size: 15px; line-height: 1.7; }
  .features { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
  .features li { display: flex; gap: 12px; align-items: flex-start; font-size: 14px; line-height: 1.55; color: var(--secondary); }
  .features strong { display: block; color: var(--text); font-weight: 600; }
  .features .ico {
    flex: none; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 9px;
    background: var(--panel); border: 1px solid var(--border); color: var(--accent);
  }
  .foot { position: relative; z-index: 1; font-size: 12px; color: var(--muted); }

  /* Form side */
  .auth { display: flex; align-items: center; justify-content: center; padding: 72px 24px 40px; }
  .auth .box { width: 100%; max-width: 380px; box-shadow: none; }
  .box .mobile-brand { display: none; margin-bottom: 28px; }
  h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -.4px; }
  .sub { margin: 8px 0 26px; font-size: 14px; color: var(--muted); }
  label { display: block; font-size: 13px; font-weight: 500; color: var(--text); margin: 16px 0 6px; }
  .field { position: relative; }
  input {
    width: 100%; height: 44px; padding: 0 14px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--panel); color: var(--text); font: inherit; font-size: 14px;
    transition: border-color .15s, box-shadow .15s;
  }
  #password { padding-right: 46px; }
  input::placeholder { color: var(--muted); opacity: .8; }
  input:hover { border-color: var(--muted); }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus {
    -webkit-text-fill-color: var(--text); caret-color: var(--text);
    box-shadow: 0 0 0 1000px var(--panel) inset; transition: background-color 9999s;
  }
  input:-webkit-autofill:focus { box-shadow: 0 0 0 1000px var(--panel) inset, 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .toggle-pw {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    display: grid; place-items: center; width: 32px; height: 32px; padding: 0;
    background: transparent; border: 0; border-radius: 8px; color: var(--muted); cursor: pointer;
  }
  .toggle-pw .eye-off, .toggle-pw[aria-pressed="true"] .eye { display: none; }
  .toggle-pw[aria-pressed="true"] .eye-off { display: block; }
  .caps { display: none; align-items: center; gap: 6px; margin: 8px 0 0; font-size: 12px; color: var(--warn); }
  .caps.show { display: flex; }
  .spinner {
    display: inline-block; width: 14px; height: 14px; margin-right: 8px; vertical-align: -2px;
    border: 2px solid rgb(255 255 255 / 40%); border-top-color: #fff; border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2s; } }
  .toggle-pw:hover { color: var(--text); background: var(--neutral); }
  button[type="submit"] {
    width: 100%; height: 46px; margin-top: 24px; border: 0; border-radius: 10px;
    font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    box-shadow: 0 6px 16px rgb(37 99 235 / 22%); transition: background .15s, transform .05s;
  }
  button[type="submit"]:active:not(:disabled) { transform: translateY(1px); }
  button[type="submit"]:disabled { opacity: .6; cursor: not-allowed; box-shadow: none; }
  .err {
    font-size: 13px; line-height: 1.5; margin: 0 0 6px; padding: 10px 12px; border-radius: 10px;
    border: 1px solid; display: none;
  }
  .err.show { display: block; }
  .note { margin: 22px 0 0; font-size: 12px; color: var(--muted); text-align: center; }
  .note a { color: var(--accent); text-decoration: none; }
  .note a:hover { text-decoration: underline; }

  @media (max-width: 860px) {
    .shell { grid-template-columns: 1fr; }
    .showcase { display: none; }
    .auth { align-items: flex-start; padding: 88px 20px 32px; }
    .box .mobile-brand { display: inline-flex; }
    .topbar { padding: 14px 16px; }
  }
</style>
<link rel="stylesheet" href="/admin/theme.css">
</head>
<body data-login-retry-after="0">
  <div class="topbar">
    <label class="theme-picker" for="theme-select"><span class="theme-label">主题</span><span class="theme-control"><span class="theme-icon" aria-hidden="true"></span><select id="theme-select" aria-label="主题">
        <option value="light">浅色</option>
        <option value="dark">深色</option>
        <option value="system">跟随系统</option>
      </select></span>
    </label>
  </div>
  <main class="shell">
    <section class="showcase" aria-label="产品介绍">
      <a class="brand" href="/" aria-label="vibeview 首页"><span class="mark" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18m-13 5 3 3 5-5"/></svg></span>vibeview</a>
      <div class="pitch">
        <h2>让本地文件，<br>成为<em>可分享的预览</em>。</h2>
        <p>集中管理上传的 HTML 报告、图表、截图和视频，控制访问码与有效期，查看上传趋势。</p>
        <ul class="features">
          <li><span class="ico" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span><span><strong>访问码保护</strong>重置、调整有效期或显式公开</span></li>
          <li><span class="ico" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span><span><strong>快速找到文件</strong>按来源、类型搜索、筛选与批量删除</span></li>
          <li><span class="ico" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10m6 10V4m6 16v-7m4 7H2"/></svg></span><span><strong>上传统计</strong>今日上传、每日趋势与来源分布</span></li>
        </ul>
      </div>
      <p class="foot">自托管 · 文件保存在你自己的服务器上</p>
    </section>
    <section class="auth">
  <form class="box" method="post" action="/admin/login" id="login-form">
    <a class="brand mobile-brand" href="/" aria-label="vibeview 首页"><span class="mark" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18m-13 5 3 3 5-5"/></svg></span>vibeview</a>
    <h1>登录管理端</h1>
    <p class="sub">使用管理员账号登录，浏览、分享和管理预览。</p>
    <div class="err" id="err" role="alert"></div>
    <label for="user">账号</label>
    <input id="user" name="user" placeholder="请输入账号" autocomplete="username"
           autocapitalize="none" autocorrect="off" spellcheck="false" autofocus required>
    <label for="password">密码</label>
    <div class="field">
      <input id="password" name="password" type="password" placeholder="请输入密码"
             autocomplete="current-password" required>
      <button type="button" class="toggle-pw" id="toggle-pw" aria-label="显示密码" aria-pressed="false" title="显示密码">
        <svg class="eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10.6 10.6 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.1 3.9M6.6 6.6C3.9 8.3 2 12 2 12s3.6 7 10 7c1.8 0 3.4-.5 4.7-1.3M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
      </button>
    </div>
    <p class="caps" id="caps" role="status"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4 4 12h4v6h8v-6h4z"/></svg>大写锁定已开启</p>
    <button type="submit" id="submit">登录</button>
    <p class="note"><a href="/">← 返回首页</a></p>
  </form>
    </section>
  </main>
  <script>
    (function () {
      var err = document.getElementById('err');
      var retryAfter = Number(document.body.dataset.loginRetryAfter);
      if (retryAfter > 0) {
        var deadline = Date.now() + retryAfter * 1000;
        var submit = document.getElementById('submit');
        err.classList.add('show');
        function countdown() {
          var remaining = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
          submit.disabled = remaining > 0;
          submit.textContent = remaining > 0 ? remaining + ' 秒后重试' : '登录';
          err.textContent = remaining > 0 ? '登录尝试次数过多，请等待 ' + remaining + ' 秒后重试。' : '可以重新登录，请确认账号和密码。';
          if (!remaining) clearInterval(timer);
        }
        var timer = setInterval(countdown, 1000);
        countdown();
      }
      var userInput = document.getElementById('user');
      var lastUserKey = 'vibeview-login-user';
      if (new URLSearchParams(location.search).get('error')) {
        err.textContent = '账号或密码错误，请重试';
        err.classList.add('show');
        // Keep the account the user just typed; only the password needs re-entry.
        try {
          var lastUser = sessionStorage.getItem(lastUserKey);
          if (lastUser && !userInput.value) {
            userInput.value = lastUser;
            document.getElementById('password').focus();
          }
        } catch (_) {}
        // strip error from URL so refresh doesn't keep flashing
        if (window.history && history.replaceState) {
          history.replaceState(null, '', '/admin/login');
        }
      }
      var pw = document.getElementById('password');
      var toggle = document.getElementById('toggle-pw');
      toggle.addEventListener('click', function () {
        var show = pw.type === 'password';
        pw.type = show ? 'text' : 'password';
        var label = show ? '隐藏密码' : '显示密码';
        toggle.setAttribute('aria-pressed', String(show));
        toggle.setAttribute('aria-label', label);
        toggle.title = label;
        pw.focus();
      });
      var caps = document.getElementById('caps');
      function checkCaps(event) {
        if (event.getModifierState) caps.classList.toggle('show', event.getModifierState('CapsLock'));
      }
      pw.addEventListener('keydown', checkCaps);
      pw.addEventListener('keyup', checkCaps);
      pw.addEventListener('blur', function () { caps.classList.remove('show'); });
      // Hide a stale credential error once the user edits; keep the cooldown message.
      ['user', 'password'].forEach(function (id) {
        document.getElementById(id).addEventListener('input', function () {
          if (!(retryAfter > 0)) err.classList.remove('show');
        });
      });
      var submitButton = document.getElementById('submit');
      document.getElementById('login-form').addEventListener('submit', function () {
        try { sessionStorage.setItem(lastUserKey, userInput.value); } catch (_) {}
        submitButton.disabled = true;
        submitButton.innerHTML = '<span class="spinner" aria-hidden="true"></span>登录中…';
      });
      // Back navigation may restore this page from cache with the button still busy.
      window.addEventListener('pageshow', function (event) {
        if (event.persisted && !(retryAfter > 0)) {
          submitButton.disabled = false;
          submitButton.textContent = '登录';
        }
      });
    })();
  </script>
</body>
</html>
